services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: Sapo_Chow
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d Sapo_Chow"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql+asyncpg://postgres:admin@db:5432/Sapo_Chow"
      SECRET_KEY: "fa4769029abaf9b65585ec2d7ef029a0b82941459a8ea999788b038a98cc5531"
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE_MB: "10"
      TECTONIC_PATH: tectonic
      PDF_OUTPUT_DIR: /app/pdfs
      FRONTEND_URL: "http://localhost:3000"
    volumes:
      - api_uploads:/app/uploads
      - api_pdfs:/app/pdfs
      - tectonic_cache:/root/.cache/tectonic
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg_data:
  api_uploads:
  api_pdfs:
  tectonic_cache:
